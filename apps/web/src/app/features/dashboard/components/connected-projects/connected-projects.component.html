<section class="panel">
  <header>
    <div>
      <span class="section-label">Projects</span>
      <h2>Synced repositories</h2>
    </div>
    <label>
      <ng-icon name="lucideSearch" aria-hidden="true" />
      <input
        type="search"
        placeholder="Search"
        [value]="query"
        (input)="queryChange.emit($any($event.target).value)"
      />
    </label>
  </header>

  <div class="project-grid">
    @for (project of projects; track project.id) {
      <article
        [class.is-selected]="selectedProject?.id === project.id"
        [class.is-archived]="project.status === 'ARCHIVED'"
      >
        <button type="button" class="project-main" (click)="projectFocused.emit(project)">
        <div>
          <span>{{ project.provider }}</span>
          @if (providerIconMap[project.provider]; as iconName) {
            <ng-icon [name]="iconName" aria-hidden="true" style="margin-inline: .4rem;" />
          }
        </div>

          <strong>{{ project.name }}</strong>
          <small>
            branch: {{ project.defaultBranch }} -
            <span
              class="status-dot"
              [class]="statusClassMap[project.status] || 'dot-gray'">
            </span>
          </small>
        </button>
        <button
          type="button"
          class="manage"
          title="Manage repository"
          (click)="projectManaged.emit(project)"
        >
          <ng-icon name="lucideSettings" aria-hidden="true" />
        </button>
      </article>
    } @empty {
      <p class="empty-copy">Sync a project to start building your queue.</p>
    }
  </div>
</section>
