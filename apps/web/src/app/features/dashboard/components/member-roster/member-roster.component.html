<section class="compact-panel">
  <button type="button" class="summary-button" (click)="dialogOpen.set(true)">
    <span class="summary-icon">
      <ng-icon name="lucideUsers" aria-hidden="true" />
    </span>
    <span>
      <small>Members</small>
      <strong>{{ members.length }} teammates</strong>
    </span>
    <span class="avatar-stack" aria-hidden="true">
      @for (member of members.slice(0, 4); track member.id) {
        <span>{{ initials(member.name) }}</span>
      }
    </span>
  </button>
</section>

@if (dialogOpen()) {
  <div class="dialog-backdrop" (click)="dialogOpen.set(false)"></div>
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="members-title">
    <header>
      <div>
        <span class="section-label">Members</span>
        <h2 id="members-title">Team roles</h2>
      </div>
      <button type="button" class="icon-button" aria-label="Close" (click)="dialogOpen.set(false)">
        <ng-icon name="lucideX" aria-hidden="true" />
      </button>
    </header>

    <div class="member-list">
      @for (member of members; track member.id) {
        <article>
          <div class="avatar" aria-hidden="true">{{ initials(member.name) }}</div>
          <div class="text">
            <strong>{{ member.name }}</strong>
            <small>{{ member.title || 'No title assigned' }} - {{ member.role }}</small>
          </div>
          <div class="member-actions">
            <button type="button" title="Edit member" (click)="edit(member)">
              <ng-icon name="lucidePencil" aria-hidden="true" />
            </button>
            <button
              type="button"
              title="Remove member"
              [disabled]="!canRemove(member)"
              (click)="remove(member)"
            >
              <ng-icon name="lucideTrash2" aria-hidden="true" />
            </button>
          </div>
        </article>
      } @empty {
        <p class="empty-copy">Add members to keep ownership visible.</p>
      }
    </div>
  </section>
}
