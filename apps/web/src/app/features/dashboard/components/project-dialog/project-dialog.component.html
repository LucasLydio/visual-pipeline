<div class="dialog-backdrop" (click)="closed.emit()"></div>
<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="project-dialog-title">
  <h2 id="project-dialog-title">Sync project</h2>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      <span>GitHub repository</span>
      <select formControlName="repositoryId" (change)="selectRepository($any($event.target).value)">
        <option value="">
          {{ repositoriesLoading() ? 'Loading repositories...' : 'Select a repository' }}
        </option>
        @for (repository of repositories(); track repository.id) {
          <option [value]="repository.id">
            {{ repository.fullName }}{{ repository.private ? ' - private' : '' }}
          </option>
        }
      </select>
    </label>
    @if (repositoriesError(); as error) {
      <p class="dialog-error" role="alert">{{ error }}</p>
    }
    <label>
      <span>Name</span>
      <input formControlName="name" placeholder="Checkout service" />
    </label>
    <label>
      <span>Repository URL</span>
      <input
        formControlName="repositoryUrl"
        placeholder="https://github.com/acme/checkout"
        readonly
      />
    </label>
    <label>
      <span>Default branch</span>
      <input formControlName="defaultBranch" />
    </label>
    <label>
      <span>Execution mode</span>
      <select formControlName="executionMode">
        @for (mode of executionModes; track mode) {
          <option [value]="mode">{{ mode }}</option>
        }
      </select>
    </label>
    <div class="dialog-actions">
      <button type="button" class="neutral" (click)="closed.emit()">Cancel</button>
      <button type="submit">Sync</button>
    </div>
  </form>
</section>
